[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rojakface-mcp-workspace"
version = "0.1.0"
description = "Air-gapped RojakFace Biometric Identity MCP Service & Admin Portal for LibreChat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",
    "qdrant-client>=1.12.0",
    "RojakFace>=1.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
]
