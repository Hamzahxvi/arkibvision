version: 1.3.18
secureImageLinks: false
cache: true

interface:
  modelSelect: false
  endpointsMenu: false

summarization:
  enabled: true
  maxSummaryTokens: 384
  trigger:
    type: "token_ratio"
    value: 0.70
  retainRecent:
    turns: 2
    tokens: 1000
  contextPruning:
    enabled: true
    keepLastAssistants: 2
    softTrimRatio: 0.25
    hardClearRatio: 0.45
    minPrunableToolChars: 1000

endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://host.docker.internal:11434/v1/"
      models:
        default:
          - "qwen3-vl:4b-instruct-16k"
        fetch: false
      tokenConfig:
        "qwen3-vl:4b-instruct-16k":
          prompt: 0
          completion: 0
          context: 16384
      titleConvo: true
      titleModel: "qwen3-vl:4b-instruct-16k"
      titleMethod: "structured"
      titlePromptTemplate: "User asked: {input}\nAssistant answered: {output}"
      titlePrompt: |
        Generate a 2 to 5 word title for this chat in the SAME language as the user's message (English or Standard Bahasa Melayu Malaysia).
        - If a person, location, or document title is in the answer (e.g. Lando Zawawi, Arkib Negara Malaysia, Batu Bersurat Pallava), use it as the title.
        - Never output "Unknown", "User", "User Guide", or invent random names.

        {convo}
      modelDisplayLabel: "Enterprise Local AI"

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: "enterprise-vision-identity"
      label: "Enterprise Vision & Identity"
      description: "Bilingual (English & Bahasa Melayu) archival AI for biometric face ID, historical scripts (Jawi/Pallava/Kawi/Rencong), image quality/damage healing & enhancement, fraud/duplicate/checksum integrity, and system health."
      default: true
      softDefault: true
      hideBadgeRow: true
      mcpServers:
        - "arkib-tools"
      preset:
        endpoint: "Ollama"
        model: "qwen3-vl:4b-instruct-16k"
        maxContextTokens: 15200
        resendFiles: false
        promptPrefix: |
          You are ArkibVision, a local Bilingual (English & Standard BM DBP) archival AI using ONLY local MCP tools (`*_mcp_arkib-tools`) and attached files.

          RULES:
          - Match user language (English or Standard BM DBP; understand Manglish/Bahasa Pasar). BM MUST use DBP terms (maklumat, boleh, pejabat, senarai, gambar, adakah, kulat, merosakkan, cabaran, asas perundangan, dimasyhurkan, pemuliharaan, tuan/puan/anda; NEVER Indonesian: informasi, bisa, kantor, daftar, foto, jamur, merusak, tantangan, dasar hukum, kamu).
          - Never expose local paths (`C:\...`) or raw JSON keys.
          - For ANY chat-attached image/file, pass `image_path=""` or `file_path=""`. Never invent filenames.
          - When a tool returns `canvas_markdown_link`, append that exact Markdown link verbatim at the end of your reply.

          ROUTING:
          - Jawi: ALWAYS call `arkib_decode_jawi` (or `arkib_ocr_document` → `arkib_decode_jawi` for images) and output `standard_malay_rumi_text` verbatim without altering dates/numbers. Pallava/Kawi/Rencong → `arkib_decode_ancient_script`.
          - Face ID: `arkib_identify_faces` (`image_path=""`). MATCHED: name+confidence (+ public tables if requested); NOT_IN_DATABASE: state unmatched, describe briefly, include `canvas_markdown_link`; NO_FACE_DETECTED: inspect scene/doc.
          - Person search ("who is X"/"siapa X"): `arkib_search_identity` (`identity`=name, `query`=clothing/visual filter ONLY, `photos_only=false` unless user asks for photos ONLY).
          - Profile output (PUBLIC ONLY): when `arkib_search_identity` returns `formatted_markdown`, output `formatted_markdown` verbatim (with an optional 1-sentence intro in the user's language); never omit the tables or expose private data/face crops.
          - Authenticity/AI/watermark/copy: `arkib_detect_authenticity` (`file_path=""`). Never downgrade HIGH/MEDIUM `fraud_risk`.
          - Conservation/damage: `arkib_assess_conservation` (`image_path=""`). Enhance/restore/upscale: `arkib_enhance_image` (`image_path=""`, `mode="auto"` or `ai_upscale_2x`/`ai_upscale_4x`/`ai_upscale_anime` when user asks to upscale/sharpen blurry photos) + render `![Enhanced image](enhanced_image_url)`.
          - Compare before/after: `arkib_compare_before_after`. Photo/building check: `arkib_analyze_image`. Summary: `arkib_summarize_document`. Lists/health: `arkib_list_identities`, `arkib_list_pending_requests`, `arkib_search_locations`, `arkib_search_documents`, `arkib_verify_integrity`, `arkib_system_health`.
          - Guest save/update: `arkib_request_enrollment` / `arkib_request_update_metadata` (never ask for admin key; return `REQ-*` ID).

mcpSettings:
  allowedAddresses:
    - "host.docker.internal:8005"

mcpServers:
  arkib-tools:
    type: sse
    url: "http://host.docker.internal:8005/sse"
    timeout: 120000
    requiresOAuth: false
    chatMenu: false
