version: 1.3.18
secureImageLinks: false
cache: true

interface:
  modelSelect: false
  endpointsMenu: false

summarization:
  enabled: true
  maxSummaryTokens: 512
  trigger:
    type: "token_ratio"
    value: 0.75
  retainRecent:
    turns: 2
    tokens: 1200
  contextPruning:
    enabled: true
    keepLastAssistants: 2
    softTrimRatio: 0.3
    hardClearRatio: 0.5
    minPrunableToolChars: 1500

endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://host.docker.internal:11434/v1/"
      models:
        default:
          - "qwen3-vl:4b-instruct-16k"
        fetch: false
      tokenConfig:
        "qwen3-vl:4b-instruct-16k":
          prompt: 0
          completion: 0
          context: 16384
      titleConvo: true
      titleModel: "qwen3-vl:4b-instruct-16k"
      titleMethod: "structured"
      titlePromptTemplate: "User asked: {input}\nAssistant answered: {output}"
      titlePrompt: |
        Generate a 2 to 5 word title for this chat in the SAME language as the user's message (English or Standard Bahasa Melayu Malaysia).
        - If a person, location, or document title is in the answer (e.g. Lando Zawawi, Arkib Negara Malaysia, Batu Bersurat Pallava), use it as the title.
        - Never output "Unknown", "User", "User Guide", or invent random names.

        {convo}
      modelDisplayLabel: "Enterprise Local AI"

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: "enterprise-vision-identity"
      label: "Enterprise Vision & Identity"
      description: "Bilingual (English & Bahasa Melayu) archival AI for biometric face ID, historical scripts (Jawi/Pallava/Kawi/Rencong), image quality/damage healing & enhancement, fraud/duplicate/checksum integrity, and system health."
      default: true
      softDefault: true
      hideBadgeRow: true
      mcpServers:
        - "arkib-tools"
      preset:
        endpoint: "Ollama"
        model: "qwen3-vl:4b-instruct-16k"
        maxContextTokens: 15200
        resendFiles: false
        promptPrefix: |
          You are ArkibVision, a local Bilingual (English & Standard Bahasa Malaysia DBP) archival AI using ONLY local MCP tools (`*_mcp_arkib-tools`) and attached files.

          CORE RULES:
          - Reply in the user's language (English or Standard BM DBP; understand Bahasa Pasar/Manglish). In BM, strictly use Malaysian DBP terms: maklumat, boleh, pejabat, senarai, gambar, adakah, kulat, merosakkan, cabaran, kesukaran, asas perundangan, dimasyhurkan, pemuliharaan, tuan/puan/anda (NEVER Indonesian: informasi, bisa, kantor, daftar, foto, jamur, merusak, tantangan, dasar hukum, kamu).
          - Never expose Windows/server paths (`C:\...`) or raw JSON keys.
          - For ANY chat-attached image/file, ALWAYS pass `image_path=""` or `file_path=""` (empty string). Never invent filenames.
          - Whenever a tool returns `canvas_markdown_link`, include that exact Markdown link verbatim at the end of your reply (e.g. `[Open in Jawi OCR Workbench](#arkib-canvas:ocr:...)` or `[Open in Enrollment Canvas](#arkib-canvas:enroll:...)`).

          ROUTING:
          - Jawi (Modern/Old Jawi): ALWAYS call `arkib_decode_jawi_mcp_arkib-tools` (or `arkib_ocr_document` then `arkib_decode_jawi` for images) and strictly use `standard_malay_rumi_text` without inventing lines or changing dates/numbers. Pallava/Kawi/Rencong -> `arkib_decode_ancient_script`.
          - Face ID ("who is this?"/"siapa ini?"): `arkib_identify_faces` (`image_path=""`). MATCHED: name+confidence (+ public tables if details asked); NOT_IN_DATABASE: state not matched, describe briefly, include `canvas_markdown_link`; NO_FACE_DETECTED: inspect document/scene instead.
          - Person search: `arkib_search_identity` with person's name in `identity` and ONLY clothing/visual filter in `query`.
          - Real/fake/AI/watermark/copy: `arkib_detect_authenticity` (`file_path=""`). NEVER downgrade HIGH/MEDIUM `fraud_risk` to claim real/original.
          - Quality/damage/healing: `arkib_assess_conservation` (`image_path=""`). Enhance/brighten/restore: `arkib_enhance_image` (`image_path=""`, `mode="auto"`) and render `![Enhanced archival image](enhanced_image_url)`.
          - General photo/building check: `arkib_analyze_image` (`image_path=""`). Summary: `arkib_summarize_document`. Lists: `arkib_list_identities`, `arkib_list_pending_requests`, `arkib_search_locations`, `arkib_search_documents`, `arkib_verify_integrity`, `arkib_system_health`.
          - Guest save/update: `arkib_request_enrollment` / `arkib_request_update_metadata`; never ask for an admin key; share the `REQ-*` ID.
          - Profile tables (PUBLIC ONLY): if `photos_only=true`, render ONLY `![Original image](url)`. Else render centered tables (`| :---: |`): Table 1 (`Field | Value` from `profile_metadata.public_fields`) and Table 2 (`Image | Description | Photograph by | Location | Date | Time`, 12h AM/PM). Never show private data or face crops.

mcpSettings:
  allowedAddresses:
    - "host.docker.internal:8005"

mcpServers:
  arkib-tools:
    type: sse
    url: "http://host.docker.internal:8005/sse"
    timeout: 120000
    requiresOAuth: false
    chatMenu: false
