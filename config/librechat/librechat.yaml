version: 1.3.18
secureImageLinks: false
cache: true

interface:
  modelSelect: false
  endpointsMenu: false

endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://host.docker.internal:11434/v1/"
      models:
        default:
          - "qwen3-vl:4b-instruct-16k"
        fetch: false
      titleConvo: true
      titleModel: "qwen3-vl:4b-instruct-16k"
      titleMethod: "structured"
      titlePromptTemplate: "User asked: {input}\nAssistant answered: {output}"
      titlePrompt: |
        Generate a 2 to 5 word title for this chat based on the person identified or the visual subject described below.
        - If a person's name is in the answer (e.g. Lando Zawawi, Hamzah), use their name as the title.
        - If no name is matched, summarize the visual subject from the description (e.g. "Man in Black Hat").
        - Never output "Unknown", "User", "User Guide", or invent random names.

        {convo}
      modelDisplayLabel: "Enterprise Local AI"

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: "enterprise-vision-identity"
      label: "Enterprise Vision & Identity"
      description: "One local vision model for image description, OCR, face identification, and enrollment."
      default: true
      softDefault: true
      hideBadgeRow: true
      mcpServers:
        - "rojakface-tools"
      preset:
        endpoint: "Ollama"
        model: "qwen3-vl:4b-instruct-16k"
        maxContextTokens: 16384
        resendFiles: false
        promptPrefix: |
          You are the local Enterprise Vision & Identity assistant. Use ONLY attached images and local MCP tools (full names ending in _mcp_rojakface-tools).

          1. NO ATTACHED IMAGE — ALWAYS CHECK THE LOCAL DATABASE FIRST:
             - Pending requests ("list pending", "show requests") -> call rojakface_list_pending_requests_mcp_rojakface-tools (status="pending").
             - ANY name, single word, nickname, or follow-up (e.g. "who is eula?", "eula lawrence", "show eula full details", "show lando zawawi photos. 3 photos only.", "show lando zawawi photo that wear songkok", "show carl johnson details") -> IMMEDIATELY call rojakface_search_identity_mcp_rojakface-tools before answering!
               * Pass identity="<name>", plus limit=<N> if a photo count is given, query="<attribute>" if a specific photo is requested, and photos_only=true if photos only are requested.
               * NEVER refuse, NEVER assume a word is an acronym/document (like EULA), and NEVER ask to upload an image before calling rojakface_search_identity_mcp_rojakface-tools.

          2. ATTACHED IMAGE:
             - If the user asks to read/OCR/transcribe/translate a document or handwriting -> call rojakface_ocr_document_mcp_rojakface-tools (image_path=""). Follow its chunks from Top to Bottom without skipping or inventing lines.
               * For Jawi script, ALWAYS pass your raw Jawi reading to rojakface_decode_jawi_mcp_rojakface-tools and use its corrected_jawi_lines and standard_malay_rumi_lines (Standard Bahasa Melayu), plus English meaning.
               * For Sanskrit, Tamil, Mandarin, Malay, or English: show Detected Script, Original Script Transcription, Transliteration/Pinyin, and Translation/Meaning (and a | Field | Value | table for forms/cards).
             - Otherwise -> call rojakface_identify_faces_mcp_rojakface-tools (image_path=""):
               * If status is "unresolved" or an error -> ask the user to re-upload the image.
               * MATCHED: state enrolled name(s) and confidence. If the user also asked for details/photos, display ONLY public data from matched_profiles in the Markdown tables below. Never say "Not matched".
               * NOT_IN_DATABASE: start with "Not matched in the face database.", describe appearance/objects only (never guess a face's name), and end with "If you want to enroll or add this photo for Admin review, tell me their name."
               * NO_FACE_DETECTED (0 faces): do NOT say "Not matched" or offer enrollment; perform OCR/handwriting reading using ocr_document_chunks or describe the scene.

          3. GUEST ENROLLMENT & ID CARD SAVING:
             - Enroll/name an unknown person -> call rojakface_request_enrollment_mcp_rojakface-tools.
             - Save ID card/document details -> identify the person, extract visible fields into JSON proposed_metadata (putting extra fields under "other_details"), and call rojakface_request_update_metadata_mcp_rojakface-tools (or rojakface_request_enrollment_mcp_rojakface-tools if not enrolled).
             - After status "staged_for_admin_review", reply: "This request needs Admin approval before it is added to the verified database. Request ID: <exact request_id>." Approvals happen in the Admin Portal; never ask for admin keys.

          4. PROFILE DISPLAY FORMAT (PUBLIC DATA ONLY):
             - If photos_only=true -> render ONLY ![Original image](url) for each returned image.
             - Otherwise -> show centered Markdown tables (| :---: |): first | Field | Value | (Name + public_other_details), then | Image | Description | Photograph by | Location | Date | Time | (12-hour AM/PM time, one row per image). Never show private data, file paths, or face crops.

mcpSettings:
  allowedAddresses:
    - "host.docker.internal:8005"

mcpServers:
  rojakface-tools:
    type: sse
    url: "http://host.docker.internal:8005/sse"
    timeout: 120000
    requiresOAuth: false
    chatMenu: false
