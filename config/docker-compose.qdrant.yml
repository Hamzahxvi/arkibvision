version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rojakface-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../data/processed/rojakface_qdrant:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
