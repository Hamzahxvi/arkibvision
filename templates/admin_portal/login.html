<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RojakFace — Admin Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ffffff;color:#0f172a;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;transition:background .15s,color .15s}
.login{width:min(420px,calc(100% - 32px));background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:30px;box-shadow:0 20px 50px rgba(15,23,42,.08)}
.brand{display:inline-flex;align-items:center;gap:8px;color:#1d4ed8;font-weight:700;letter-spacing:.05em;margin-bottom:18px;font-size:.78rem;background:#eff6ff;border:1px solid #bfdbfe;padding:5px 10px;border-radius:99px}
h1{margin:0 0 8px;font-size:1.35rem;color:#0f172a}
p{color:#475569;font-size:.88rem;margin:0 0 22px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
label{font-size:.82rem;color:#334155;font-weight:600}
input{background:#ffffff;color:#0f172a;border:1px solid #cbd5e1;border-radius:9px;padding:11px 12px;font-size:.95rem;outline:none}
input:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.15)}
button{width:100%;background:#1d4ed8;color:#fff;border:0;border-radius:9px;padding:12px;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .15s}
button:hover{background:#1e40af}
.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:10px;margin-bottom:16px;font-size:.82rem}
body.dark{background:#0f172a;color:#f1f5f9}
body.dark .login{background:#1e293b;border-color:#334155;box-shadow:0 20px 50px rgba(0,0,0,.35)}
body.dark .brand{background:#1e3a8a;border-color:#3b82f6;color:#dbeafe}
body.dark h1{color:#f8fafc}
body.dark p,body.dark label{color:#94a3b8}
body.dark input{background:#0f172a;color:#f1f5f9;border-color:#475569}
body.dark input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.22)}
body.dark button{background:#2563eb}
body.dark button:hover{background:#1d4ed8}
body.dark .error{background:#450a0a;color:#fca5a5;border-color:#991b1b}
</style></head>
<body>
<main class="login">
  <div class="brand">🛡️ ROJAKFACE · ADMIN PORTAL</div>
  <h1>Sign in to Admin Portal</h1>
  <p>Manage people, archival locations, documents, integrity checks, and system health.</p>
  {{ERROR}}
  <form method="post" action="/admin/login">
    <input type="hidden" name="embed" id="f-embed" value=""/>
    <input type="hidden" name="theme" id="f-theme" value=""/>
    <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus/></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required/></div>
    <button type="submit">Sign in</button>
  </form>
</main>
<script>
(function(){
  const qs=new URLSearchParams(location.search);
  const embedded=qs.get('embed')==='1'||window.self!==window.top;
  if(embedded) document.getElementById('f-embed').value='1';
  function setTheme(t){
    const dark=t==='dark';
    document.body.classList.toggle('dark',dark);
    document.getElementById('f-theme').value=dark?'dark':'light';
    try{localStorage.setItem('rojakface_admin_theme',dark?'dark':'light');}catch(e){}
  }
  const initTheme=qs.get('theme')||(function(){try{return localStorage.getItem('rojakface_admin_theme');}catch(e){return null;}})()||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  setTheme(initTheme);
  window.addEventListener('message',ev=>{if(ev.data&&ev.data.type==='rojakface-theme') setTheme(ev.data.dark?'dark':'light');});
})();
</script>
</body></html>
