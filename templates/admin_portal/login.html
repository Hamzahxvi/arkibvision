<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RojakFace — Admin Login</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ffffff;color:#0f172a;font-family:Segoe UI,system-ui,sans-serif}.login{width:min(420px,calc(100% - 32px));background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:30px;box-shadow:0 20px 50px rgba(15,23,42,.08)}.brand{color:#1d4ed8;font-weight:700;letter-spacing:.04em;margin-bottom:20px;font-size:.82rem}h1{margin:0 0 8px;font-size:1.35rem;color:#0f172a}p{color:#475569;font-size:.88rem;margin:0 0 24px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}label{font-size:.82rem;color:#334155;font-weight:600}input{background:#f8fafc;color:#0f172a;border:1px solid #cbd5e1;border-radius:9px;padding:12px;font-size:1rem;outline:none}input:focus{border-color:#1d4ed8;background:#ffffff;box-shadow:0 0 0 3px rgba(29,78,216,.15)}button{width:100%;background:#1d4ed8;color:#fff;border:0;border-radius:9px;padding:12px;font-size:.95rem;font-weight:700;cursor:pointer}button:hover{background:#1e40af}.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:10px;margin-bottom:16px;font-size:.82rem}</style></head>
<body><main class="login"><div class="brand">ROJAKFACE · LOCAL ADMIN</div><h1>Sign in to Admin Portal</h1><p>Review requests and manage enrolled people.</p>{{ERROR}}<form method="post" action="/admin/login"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus/></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required/></div><button type="submit">Sign in</button></form></main></body></html>
